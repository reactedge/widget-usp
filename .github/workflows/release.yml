name: Build & publish widget

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: reactedge
    env:
      WIDGET_NAME: usp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: vite_project
        run: npm install

      - name: Build widget
        working-directory: vite_project
        run: npm run build

      - name: Verify artifact exists
        run: |
          VERSION=$(node -p "require('./vite_project/package.json').version")
          test -f "www/widget-usp@${VERSION}.iife.js"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WIDGET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [ -z "${{ secrets.WIDGET_SSH_HOST }}" ]; then
            echo "ERROR: WIDGET_SSH_HOST not set (environment secrets not visible)"
            exit 1
          fi

          ssh-keyscan -H "${{ secrets.WIDGET_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare artifact (hash + rename)
        id: prepare_artifact
        run: |
          VERSION=$(node -p "require('./vite_project/package.json').version") 
          FILE="www/widget-${WIDGET_NAME}@${VERSION}.iife.js"
          HASH=$(openssl dgst -sha256 -binary "$FILE" | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          NEW_FILE="www/widget-${WIDGET_NAME}@${HASH}.iife.js"      
          mv "$FILE" "$NEW_FILE"      
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "file=$NEW_FILE" >> $GITHUB_OUTPUT

      - name: Generate manifest
        run: |
          cat <<EOF > www/widget-${WIDGET_NAME}.manifest.json
          {
            "widget": "${WIDGET_NAME}",
            "version": "${{ steps.prepare_artifact.outputs.version }}",
            "hash": "${{ steps.prepare_artifact.outputs.hash }}",
            "filename": "widget-${WIDGET_NAME}@${{ steps.prepare_artifact.outputs.hash }}.iife.js",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Publish artifact
        run: |                
          ssh ${{ secrets.WIDGET_SSH_USER }}@${{ secrets.WIDGET_SSH_HOST }} \
            "mkdir -p /var/www/widgets/usp"
           rsync -av \
            --chown=www-data:www-data \
            ${{ steps.prepare_artifact.outputs.file }} \
            www/widget-usp.manifest.json \
            ${{ secrets.WIDGET_SSH_USER }}@${{ secrets.WIDGET_SSH_HOST }}:/var/www/widgets/usp/
      
          rsync -avz \
            www/cdn/ \
            ${{ secrets.WIDGET_SSH_USER }}@${{ secrets.WIDGET_SSH_HOST }}:/var/www/widgets/usp/cdn/
